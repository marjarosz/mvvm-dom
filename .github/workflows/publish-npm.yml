name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'marjarosz/mvvm-dom' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'mvvm-dom');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag must match package version');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(pkg.repository.url, 'git+https://github.com/marjarosz/mvvm-dom.git');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          assert.match(changelog, new RegExp('^## ' + pkg.version.replaceAll('.', '\\.') + ' - \\d{4}-\\d{2}-\\d{2}$', 'm'));
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check trusted publishing support
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const v = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = v.split('.').map(Number);
          if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) {
            throw new Error(`Trusted Publishing requires npm >= 11.5.1, found ${v}`);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test production demo
        run: npm run test:demo
      # npm publish runs the existing prepublishOnly hook: npm run check.
      # This includes library build, types, unit/browser tests and tarball consumer test.
      - name: Publish with OIDC after prepublishOnly checks
        run: npm publish --access public --tag latest --registry https://registry.npmjs.org/
